<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprendre le CSS</title>

    <!-- css interne -->
    <style>
        body {
            background-color: rgb(1, 0, 19);
            font-family: Arial;
        }
        h1 {
            color: #f1d5ff;
            text-align: center;
        }
    </style>

    <!-- css externe : lien vers le fichier css externe -->
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- module 1 : introduction et methide pour ajouter du css -->
    <h1>
        Apprendre le CSS
    </h1>
    <h2>Contenue style par de css externe (recommande)</h2>
    <h2 style="color:rgba(106, 90, 255, 0.666); font-size: 24px; ;">Contenue style par de css inline (a eviter)</h2>

    <!-- couleur et unite : differente facons de definir le couleurs  -->
    <p class="couleur-nom">Nom de couleur </p>
</body>
</html>
